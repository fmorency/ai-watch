name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test without provider accounts or network requests
        run: python -m unittest discover -s tests -v
      - name: Build and install
        run: python -m pip install .
      - name: Check installed commands outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          ai-watch --version
          ai-watch --demo --once --no-color
          ai-usage --demo --json --hide-email > demo.json
          python -c 'import json; d=json.load(open("demo.json")); assert len(d["accounts"]) == 3; assert all("email" not in a for a in d["accounts"])'
