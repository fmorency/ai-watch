name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test without provider accounts or network requests
        run: python -m unittest discover -s tests -v
      - name: Build and install
        run: python -m pip install .
      - name: Check installed commands outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          ai-watch --version
          ai-watch --demo --once --no-color
          ai-usage --demo --json --hide-email > demo.json
          python -c 'import json; d=json.load(open("demo.json")); assert len(d["accounts"]) == 3; assert all("email" not in a for a in d["accounts"])'
